<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PORTON ponude</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #e8e6e1; font-family: Arial, Helvetica, sans-serif; color: #111; }
    .app { display: grid; grid-template-columns: 400px 1fr; min-height: 100vh; }
    .panel { background: #1a1a2e; color: #fff; padding: 18px 16px 36px; overflow-y: auto; max-height: 100vh; }
    .panel h1 { font-size: 18px; }
    .sub { color: #c9c9d4; font-size: 12px; margin: 4px 0 14px; }
    label { display: block; font-size: 10px; color: #c9c9d4; margin: 8px 0 3px; text-transform: uppercase; letter-spacing: .4px; }
    input, select, textarea { width: 100%; padding: 7px 8px; border: 1px solid #3a3a55; background: #121225; color: #fff; border-radius: 4px; font-size: 13px; }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
    .item { background: #121225; border: 1px solid #3a3a55; border-radius: 6px; padding: 8px; margin-top: 8px; }
    .item .hd { display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: #c9c9d4; margin-bottom: 4px; }
    .ok { color: #9fdfb3; font-size: 11px; margin-top: 4px; }
    .warn { color: #ffb4b4; font-size: 11px; margin-top: 4px; }
    .btn { border: 0; cursor: pointer; border-radius: 5px; padding: 9px 12px; font-weight: 700; font-size: 13px; }
    .btn-red { background: #c41e3a; color: #fff; width: 100%; margin-top: 10px; }
    .btn-g { background: #2d6a4f; color: #fff; width: 100%; margin-top: 8px; }
    .btn-x { background: transparent; color: #fff; border: 1px solid #555; padding: 4px 8px; font-size: 11px; }
    .btn-del { background: #7a1f2e; color: #fff; border: 0; padding: 4px 8px; font-size: 11px; border-radius: 4px; cursor: pointer; }
    .extras { margin-top: 6px; max-height: 120px; overflow: auto; border: 1px solid #3a3a55; padding: 4px 6px; border-radius: 4px; }
    .extras label { display: flex; align-items: center; gap: 6px; text-transform: none; font-size: 11px; color: #ddd; margin: 3px 0; letter-spacing: 0; }
    .extras input { width: auto; }
    .preview { padding: 16px; display: flex; justify-content: center; }
    .sheet {
      width: 210mm; min-height: 297mm; background: #fff;
      padding: 10mm 14mm 12mm; box-shadow: 0 8px 30px rgba(0,0,0,.18);
      color: #111;
    }
    .memo { height: auto; margin-bottom: 6mm; display: grid; grid-template-columns: auto 1fr; gap: 8mm; align-items: start; }
    .memo img { height: 18mm; width: auto; display: block; }
    .memo .firma { margin-top: 0; font-size: 8.5px; color: #222; line-height: 1.4; text-align: right; }
    .memo .firma b { display: block; font-size: 10px; color: #1a1a2e; margin-bottom: 1px; }
    .top { display: grid; grid-template-columns: 1fr 77mm; gap: 8mm; align-items: start; }
    .sheet h2 { font-size: 22px; font-weight: 700; letter-spacing: .3px; }
    .tl { font-size: 11px; margin-top: 5px; }
    .tl b { color: #c41e3a; }
    .kupac { margin-top: 10px; font-size: 11px; }
    .kupac b { display: block; font-size: 11px; margin-bottom: 2px; }
    .meta { border: 0.5px solid #aaa; font-size: 8.5px; }
    .meta div { display: grid; grid-template-columns: 28mm 1fr; border-bottom: 0.5px solid #aaa; padding: 4.2px 6px; min-height: 6.8mm; align-items: center; }
    .meta div:last-child { border-bottom: 0; }
    table.stavke { width: 100%; border-collapse: collapse; margin-top: 8mm; font-size: 8.5px; }
    table.stavke th { background: #1a1a2e; color: #fff; text-align: left; padding: 5px 4px; font-weight: 700; font-size: 7.5px; letter-spacing: .2px; }
    table.stavke td { padding: 6px 4px; vertical-align: top; border-bottom: 1px solid #e6e6e6; }
    table.stavke tr:nth-child(even) td { background: #f5f5f5; }
    table.stavke .opis { line-height: 1.35; }
    .r { text-align: right; } .c { text-align: center; }
    .totals { width: 88mm; margin: 5mm 0 0 auto; border: 0.5px solid #888; font-size: 10px; overflow: hidden; }
    .totals div { display: flex; justify-content: space-between; padding: 3.5px 8px; }
    .grand { background: #c41e3a; color: #fff; font-weight: 700; }
    .nap { margin-top: 7mm; font-size: 9px; line-height: 1.45; }
    .nap b { color: #c41e3a; display: block; margin-bottom: 2px; }
    .foot { display: grid; grid-template-columns: 1fr 1fr; gap: 4mm; margin-top: 6mm; }
    .box { border: 0.5px solid #aaa; padding: 7px 10px; min-height: 22mm; font-size: 9px; }
    .big { color: #c41e3a; font-size: 16px; font-weight: 700; margin: 4px 0 3px; }
    .iban { color: #c41e3a; font-size: 12px; font-weight: 700; margin: 4px 0; }
    .sign { margin-top: 8mm; font-size: 9px; }
    @page { size: A4; margin: 8mm 8mm 10mm; }
    @media print {
      html, body { background: #fff !important; }
      .panel { display: none !important; }
      .app { display: block; }
      .preview { padding: 0; }
      .sheet { box-shadow: none; width: auto; min-height: auto; padding: 0; }
      .memo { height: auto; margin-bottom: 5mm; }
    }
    @media (max-width: 980px) { .app { grid-template-columns: 1fr; } .panel { max-height: none; } }
  </style>
</head>
<body>
<div class="app">
  <aside class="panel">
    <h1>PORTON PONUDE</h1>
    <p class="sub">Cjenik 2026/2027 · print spreman</p>

    <label>Broj ponude</label>
    <div class="row2">
      <input id="broj" />
      <button class="btn btn-x" onclick="noviBroj()">Novi broj</button>
    </div>
    <label>Kupac</label>
    <input id="kupac" placeholder="Ime i prezime / firma" oninput="render()" />
    <label>Mjesto</label>
    <input id="grad" value="20000 DUBROVNIK" oninput="render()" />
    <div class="row2">
      <div><label>Datum</label><input id="datum" oninput="render()" /></div>
      <div><label>Valjanost</label><input id="valjanost" value="15 dana" oninput="render()" /></div>
    </div>
    <label>Rok isporuke</label>
    <input id="isporuka" value="30 radnih dana" oninput="render()" />
    <label>Plaćanje</label>
    <input id="placanje" value="70% avans, ostatak nakon ugradnje" oninput="render()" />
    <label>Uvećanje cijene iz cjenika (%)</label>
    <input id="postotak" type="number" value="0" oninput="render()" />

    <div id="stavke"></div>
    <button class="btn btn-g" onclick="dodaj()">+ Dodaj stavku</button>

    <div class="row2">
      <div><label>Montaža € / kom</label><input id="montaza" type="number" value="100" oninput="render()" /></div>
      <div><label>Montaža kom (prazno = sva)</label><input id="montazaKom" type="number" placeholder="sva vrata" oninput="render()" /></div>
    </div>
    <div class="row2">
      <div><label>Dostava € / kom</label><input id="dostava" type="number" value="10" oninput="render()" /></div>
      <div><label>Dostava kom (prazno = sva)</label><input id="dostavaKom" type="number" placeholder="sva vrata" oninput="render()" /></div>
    </div>
    <label>Dodatna napomena</label>
    <textarea id="napomena" rows="3" oninput="render()"></textarea>
    <button class="btn btn-red" onclick="window.print()">Print / PDF</button>
  </aside>
  <div class="preview"><div class="sheet" id="sheet"></div></div>
</div>

<script>
const FALC = {
  "Bijelo mat":{107:370,130:388,150:400,190:427,230:485,280:547},
  "Bijelo matrix":{107:380,130:398,150:412,190:440,230:513,280:577},
  "Bijelo palisander":{107:393,130:409,150:422,190:451,230:525,280:590},
  "Bijelo reflex":{107:407,130:426,150:439,190:476,230:542,280:597},
  "Saten reflex":{107:419,130:446,150:460,190:496,230:565,280:618},
  "Hrast pembroke":{107:426,130:453,150:466,190:null,230:573,280:629},
  "Beton maloja":{107:416,130:436,150:447,190:null,230:551,280:608},
  "Brijest":{107:403,130:422,150:434,190:null,230:538,280:597},
  "Orah alter":{107:405,130:424,150:436,190:null,230:540,280:596},
  "Palisandro blu":{107:424,130:445,150:456,190:null,230:560,280:617},
  "Tortora":{107:420,130:441,150:458,190:null,230:555,280:613}
};
const FILO_IV = {
  "Bijelo reflex":{107:512,130:537,150:558,190:593,230:663,280:726},
  "Saten reflex":{107:514,130:540,150:560,190:595,230:665,280:728},
  "Tortora":{107:530,130:544,150:571,190:null,230:674,280:740}
};
const FILO_SA = {
  "Bijelo mat":{107:411,130:425,150:437,190:468,230:535,280:599},
  "Lakirano bijelo sa ukladama":{107:736,130:750,150:762,190:791,230:863,280:926}
};
const MURO = {
  "Argento":{lo:640,hi:960},
  "Bijelo mat":{lo:660,hi:980},
  "Crno mat":{lo:680,hi:1000}
};
const SLIDE = {
  "Bijelo mat":{S1:467,S2:570,S3:800,S4:250,S5:400},
  "Bijelo matrix":{S1:471,S2:573,S3:803,S4:253,S5:408},
  "Bijelo palisander":{S1:478,S2:579,S3:810,S4:262,S5:430},
  "Bijelo reflex":{S1:488,S2:594,S3:825,S4:276,S5:449},
  "Saten reflex":{S1:496,S2:597,S3:829,S4:279,S5:464},
  "Hrast pembroke":{S1:506,S2:607,S3:839,S4:289,S5:474},
  "Beton maloja":{S1:496,S2:597,S3:828,S4:280,S5:457},
  "Brijest":{S1:483,S2:582,S3:813,S4:267,S5:442},
  "Orah alter":{S1:485,S2:582,S3:813,S4:269,S5:446},
  "Palisandro blu":{S1:505,S2:598,S3:829,S4:290,S5:468},
  "Tortora":{S1:493,S2:602,S3:811,S4:277,S5:470}
};
const MODELI = [
  ["falc","FALC ispuna saće"],
  ["filo_iverica","FILO cjevasta iverica"],
  ["filo_sace","FILO ispuna saće"],
  ["filo_muro","FILO MURO"],
  ["slide1","SLIDE 1 (economic + drvena maska)"],
  ["slide2","SLIDE 2 (soft close + Al maska)"],
  ["slide3","SLIDE 3 (skrivena vodilica)"],
  ["slide4","SLIDE 4 (samo krilo)"],
  ["slide5","SLIDE 5 (kazetna vrata)"]
];
const STOK = ["107","130","150","190","230","280"];
const DODACI = [
  {id:"multipunto", n:"Brava multipunto", c:300},
  {id:"hotelska", n:"Brava hotelska", c:915},
  {id:"brava_kazetna", n:"Brava za kazetna vrata", c:50},
  {id:"brava_klizna", n:"Brava za klizna sa stoperom", c:90},
  {id:"okov_crno", n:"Okov brava/prihvatnik/kapice CRNO", c:30},
  {id:"cilindar", n:"Cilindar", c:18},
  {id:"elektro", n:"Prihvatnik elektro", c:200},
  {id:"kapice4k", n:"Pokrovne kapice 4K (6 kom)", c:11},
  {id:"zurilo", n:"Zurilo", c:17},
  {id:"padajuca", n:"Padajuća brtva", c:63},
  {id:"resetka", n:"Ventilacijska rešetka", c:60},
  {id:"medumjera", n:"Međumjera krila 730/830", c:200},
  {id:"zapiljivanje", n:"Zapiljivanje dovratnika 230 na 206", c:60},
  {id:"rupa_zurilo", n:"Rupa za zurilo", c:5},
  {id:"busenje", n:"Bušenje bez rupe za ključ", c:5},
  {id:"prosirivac", n:"Proširivač 220 mm", c:150},
  {id:"zl70", n:"Z.L. 70/12 pero 40 mm", c:16},
  {id:"zl90", n:"Z.L. 90/12 pero 40 mm", c:16},
  {id:"iverica", n:"Ispuna krila cjevasta iverica", c:60},
  {id:"krilo_visina", n:"Krilo duže/kraće od dovratnika", c:100},
  {id:"krilo_sirina", n:"Krilo širine 934–1200 mm", c:530},
  {id:"muro_sirina", n:"FILO MURO nestandardna širina", c:400},
  {id:"al1", n:"AL1 Inox/Crna/Zlatna", c:26},
  {id:"al2", n:"AL2", c:52},
  {id:"st1_bez", n:"Otvora ST1 bez stakla", c:80},
  {id:"st1_sa", n:"Otvora ST1 sa staklom", c:242},
  {id:"st2_sa", n:"Otvora ST2 sa staklom", c:223},
  {id:"st3_sa", n:"Otvora ST3 sa staklom", c:190},
  {id:"nadsvjetlo_staklo", n:"Staklo nadsvjetlo", c:204},
  {id:"dosvjetlo_staklo", n:"Staklo dosvjetlo", c:401}
];

function dekori(m){
  if(m==="filo_iverica") return Object.keys(FILO_IV);
  if(m==="filo_sace") return Object.keys(FILO_SA);
  if(m==="filo_muro") return Object.keys(MURO);
  if(m.startsWith("slide")) return Object.keys(SLIDE);
  return Object.keys(FALC);
}
function slideKey(m){ return ({slide1:"S1",slide2:"S2",slide3:"S3",slide4:"S4",slide5:"S5"})[m]; }
function cijena(s){
  const v = Number(s.visina)||210, st = s.stok;
  if(s.model==="falc") return (FALC[s.dekor]||{})[st] ?? null;
  if(s.model==="filo_iverica") return (FILO_IV[s.dekor]||{})[st] ?? null;
  if(s.model==="filo_sace") return (FILO_SA[s.dekor]||{})[st] ?? null;
  if(s.model==="filo_muro"){ const r=MURO[s.dekor]; return r ? (v>=215?r.hi:r.lo) : null; }
  const sk = slideKey(s.model);
  if(sk) return (SLIDE[s.dekor]||{})[sk] ?? null;
  return null;
}
function opis(m){
  return {
    falc:["Sobna vrata FALC","Ispuna saće, 4K spojnice","magnetna brava"],
    filo_iverica:["Sobna vrata FILO","Cjevasta iverica, skrivene","baglame, magnetna brava"],
    filo_sace:["Sobna vrata FILO","Ispuna saće, skrivene","baglame, magnetna brava"],
    filo_muro:["Vrata FILO MURO","Ispuna saće, skrivene baglame","magnet, ALU skriveni štok"],
    slide1:["Klizna vrata SLIDE 1","Vodilica economic, drvena maska","ukopna ručka, saće"],
    slide2:["Klizna vrata SLIDE 2","Soft close, Al maska","ukopna ručka, saće"],
    slide3:["Klizna vrata SLIDE 3","Skrivena vodilica soft close","ukopna ručka, saće"],
    slide4:["Klizno krilo SLIDE 4","Ukopna ručka, ispuna saće","bez vodilice / maske"],
    slide5:["Klizna kazetna SLIDE 5","Kazetni dovratnik KIT","ukopna ručka, saće"]
  }[m] || ["Vrata"];
}
function stokTxt(s){
  if(s.model==="filo_muro") return "skriveni ALU";
  if(s.model && s.model.startsWith("slide")) return s.model==="slide5" ? "kazetni KIT" : "bez dovratnika";
  return (Number(s.stok)/10).toString().replace(".",",") + " cm";
}
function fmt(n){ return Number(n).toLocaleString("hr-HR",{minimumFractionDigits:2,maximumFractionDigits:2}); }
function today(){
  const d=new Date();
  return String(d.getDate()).padStart(2,"0")+"."+String(d.getMonth()+1).padStart(2,"0")+"."+d.getFullYear()+".";
}
function nextBroj(){
  const d=new Date();
  const p="P-"+String(d.getFullYear()).slice(2)+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0");
  const k="porton-broj-"+p;
  let n=1;
  try{ n=parseInt(localStorage.getItem(k)||"0",10)+1; localStorage.setItem(k,String(n)); }catch(e){}
  return p+"-"+String(n).padStart(3,"0");
}
function prazna(){ return {model:"filo_muro",dekor:"Bijelo mat",sirina:"80",visina:"210",stok:"107",kom:"1",dodaci:[]}; }

let stavke = [prazna()];

function noviBroj(){ document.getElementById("broj").value = nextBroj(); render(); }
function dodaj(){ stavke.push(prazna()); paintStavke(); render(); }
function del(i){ stavke.splice(i,1); paintStavke(); render(); }
function setS(i,f,v){
  stavke[i][f]=v;
  if(f==="model"){
    const d=dekori(v);
    if(!d.includes(stavke[i].dekor)) stavke[i].dekor=d[0];
    paintStavke();
  }
  render();
}
function toggleDodatak(i,id){
  const arr = stavke[i].dodaci || [];
  stavke[i].dodaci = arr.includes(id) ? arr.filter(x=>x!==id) : arr.concat([id]);
  paintStavke();
  render();
}
function val(id){ return document.getElementById(id).value; }
function dodaciIznos(s){
  return (s.dodaci||[]).reduce((a,id)=>{
    const d=DODACI.find(x=>x.id===id);
    return a+(d?d.c:0);
  },0);
}

function paintStavke(){
  const box=document.getElementById("stavke");
  box.innerHTML = stavke.map((s,i)=>{
    const ds=dekori(s.model);
    const base=cijena(s);
    const needStok = s.model==="falc"||s.model==="filo_iverica"||s.model==="filo_sace";
    const extrasHtml = DODACI.map(d=>{
      const on=(s.dodaci||[]).includes(d.id);
      return `<label><input type="checkbox" ${on?"checked":""} onchange="toggleDodatak(${i},'${d.id}')"><span>${d.n} (${fmt(d.c)} €)</span></label>`;
    }).join("");
    const extraSum = dodaciIznos(s);
    return `<div class="item">
      <div class="hd"><span>Stavka ${i+1}</span><button class="btn-del" onclick="del(${i})">Obriši stavku</button></div>
      <label>Model</label>
      <select onchange="setS(${i},'model',this.value)">${MODELI.map(([id,l])=>`<option value="${id}" ${s.model===id?"selected":""}>${l}</option>`).join("")}</select>
      <label>Dekor</label>
      <select onchange="setS(${i},'dekor',this.value)">${ds.map(d=>`<option ${s.dekor===d?"selected":""}>${d}</option>`).join("")}</select>
      <div class="row3">
        <div><label>Širina</label><input value="${s.sirina}" oninput="setS(${i},'sirina',this.value)"></div>
        <div><label>Visina</label><input value="${s.visina}" oninput="setS(${i},'visina',this.value)"></div>
        <div><label>Kom</label><input type="number" value="${s.kom}" oninput="setS(${i},'kom',this.value)"></div>
      </div>
      ${needStok?`<label>Štok mm</label><select onchange="setS(${i},'stok',this.value)">${STOK.map(t=>`<option ${s.stok===t?"selected":""}>${t}</option>`).join("")}</select>`:""}
      ${base==null?`<div class="warn">Nema cijene u cjeniku za ovu kombinaciju.</div>`:
        `<div class="ok">Cjenik ${fmt(base)} €${extraSum?` + dodaci ${fmt(extraSum)} €`:""} → nakon % ${fmt((base+extraSum)*(1+(Number(val("postotak"))||0)/100))} €</div>`}
      <label>Dodaci iz cjenika</label>
      <div class="extras">${extrasHtml}</div>
    </div>`;
  }).join("") || `<div class="warn" style="margin-top:8px">Nema stavki. Dodaj stavku.</div>`;
}

function render(){
  const markup=(Number(val("postotak"))||0)/100;
  const rows=stavke.map(s=>{
    const base=cijena(s);
    const extra=dodaciIznos(s);
    const raw = base==null ? null : base+extra;
    const cij=raw==null?null:+(raw*(1+markup)).toFixed(2);
    const kom=Number(s.kom)||0;
    const extraNames=(s.dodaci||[]).map(id=>(DODACI.find(x=>x.id===id)||{}).n).filter(Boolean);
    return {...s,base,extra,cij,kom,uk:cij==null?null:+(cij*kom).toFixed(2),extraNames};
  });
  const vrataKom=rows.reduce((a,r)=>a+r.kom,0);
  const vrataIzn=rows.reduce((a,r)=>a+(r.uk||0),0);
  const mKom = val("montazaKom")==="" ? vrataKom : Number(val("montazaKom"))||0;
  const dKom = val("dostavaKom")==="" ? vrataKom : Number(val("dostavaKom"))||0;
  const mI = +((Number(val("montaza"))||0)*mKom).toFixed(2);
  const dI = +((Number(val("dostava"))||0)*dKom).toFixed(2);
  const sub=+(vrataIzn+mI+dI).toFixed(2);
  const pdv=+(sub*0.25).toFixed(2);
  const tot=+(sub+pdv).toFixed(2);
  const av=+(tot*0.7).toFixed(2);
  const os=+(tot-av).toFixed(2);
  const dekoriSet=[...new Set(rows.map(r=>r.dekor))].filter(Boolean).join(" / ") || "—";
  let n=rows.length;
  const extraRows=[];
  if(mI>0){ n++; extraRows.push(`<tr><td>${n}</td><td>Montaža</td><td>—</td><td>—</td><td>${fmt(Number(val("montaza"))||0)} € / vrata</td><td class="c">${mKom}</td><td class="r">${fmt(Number(val("montaza"))||0)}</td><td class="r">${fmt(mI)}</td></tr>`); }
  if(dI>0){ n++; extraRows.push(`<tr><td>${n}</td><td>Dostava</td><td>—</td><td>—</td><td>${fmt(Number(val("dostava"))||0)} € / vrata</td><td class="c">${dKom}</td><td class="r">${fmt(Number(val("dostava"))||0)}</td><td class="r">${fmt(dI)}</td></tr>`); }
